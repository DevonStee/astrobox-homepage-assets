<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brin. 人气作品</title>
<style>
  :root { --ink: #1c1a17; --muted: #8a8278; --red: #e6322c; color-scheme: light; }
  html, body { margin: 0; background: transparent; }
  html { overflow-y: hidden; }
  body {
    font: 400 13px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  /* wide: all five in one row. narrow: one scrolling row, about 2.5 cards in view.
     The board template has no right padding (12px 0 12px 12px), so the narrow
     carousel runs off the board's edge like a native shelf; the wide grid adds
     the 12px back here so both edges line up. */
  .cards {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 0 12px;
    padding-right: 12px;
  }
  /* each card is self-contained: the face's film on top, then a text band in the
     film's own stage colour. It reads the same on any board background. */
  .card {
    display: block; width: 100%; padding: 0; margin: 0; border: 0;
    background: var(--stage, #1c1a17); color: #f2eee6;
    border-radius: 14px; overflow: hidden; isolation: isolate;
    -webkit-mask-image: -webkit-radial-gradient(white, black);  /* clip the video layer in WebKit */
    font: inherit; text-align: left; cursor: default;
  }
  .tile { position: relative; aspect-ratio: 4 / 5; overflow: hidden; }
  /* overscan 1px so WebKit's pixel-snapped video layer never leaves a seam */
  .tile img, .tile video { position: absolute; top: -1px; left: -1px; width: calc(100% + 2px); height: calc(100% + 2px); object-fit: cover; display: block; }
  .tile video { opacity: 0; transition: opacity .25s ease; }
  .tile video.on { opacity: 1; }
  .meta { padding: 9px 11px 12px; }
  /* the title is the only link on a card: full band width, light text on the
     card's own dark band (never on the board background) */
  .name {
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
    width: 100%; margin: 0; padding: 3px 0; border: 0; border-radius: 6px;
    background: none; color: #f2eee6; font-family: inherit; text-align: left;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: color .15s ease, opacity .15s ease;
    font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  }
  .name i { width: 5px; height: 5px; border-radius: 3px; background: var(--red); flex: none; }
  .name span { overflow: hidden; text-overflow: ellipsis; }
  .name::after { content: "↗"; opacity: .55; font-weight: 400; letter-spacing: 0; margin-left: auto; transition: opacity .15s ease, transform .15s ease; }
  @media (hover: hover) {
    .name:hover span { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
    .name:hover::after { opacity: 1; transform: translate(1px, -1px); }
  }
  .name:active { opacity: .7; }
  .name:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .tile, .line { cursor: default; user-select: none; -webkit-user-select: none; }
  .line {
    margin: 4px 0 0; color: rgba(242, 238, 230, .62); font-size: 11px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 3em;
  }
  @media (max-width: 639px) {
    .cards {
      grid-template-columns: none;
      grid-auto-flow: column;
      grid-auto-columns: 40vw;
      gap: 0 3vw;
      padding-right: 0;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .cards::-webkit-scrollbar { display: none; }
    .card { scroll-snap-align: start; border-radius: 3.4vw; }
    .card:last-child { margin-right: 12px; }
    /* narrow: every size is a share of the iframe width, so the board is
       exactly 0.7 of its width (film 50vw + band 20vw); the template's
       aspect-ratio 10/7 fallback then matches even without resize */
    .meta { height: 20vw; box-sizing: border-box; padding: 2.6vw 2.8vw 0; overflow: hidden; }
    .name { font-size: 2.9vw; gap: 1.5vw; letter-spacing: .04em; }
    .name i { width: 1.4vw; height: 1.4vw; }
    .line { margin-top: 1vw; font-size: 3vw; line-height: 1.42; min-height: 0; }
  }
  /* ---- group=new: carousel (other groups unaffected) */
  body.carousel .rail { position: relative; }
  body.carousel .cards {
    grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 29vw;
    gap: 0 1.6vw; overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none;
  }
  body.carousel .cards::-webkit-scrollbar { display: none; }
  body.carousel .card { scroll-snap-align: start; }
  body.carousel .card:last-child { margin-right: 12px; }
  body.carousel .nav {
    position: absolute; top: calc(29vw * 1.25 / 2 - 17px); width: 34px; height: 34px; z-index: 3;
    border: 0; border-radius: 50%; padding: 0; cursor: pointer;
    background: rgba(20, 18, 16, .55); color: #f2eee6;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: grid; place-items: center; font: 600 16px/1 -apple-system, sans-serif;
    transition: background .2s ease, opacity .2s ease; -webkit-tap-highlight-color: transparent;
  }
  body.carousel .nav.prev { left: 8px; }
  body.carousel .nav.next { right: 20px; }
  body.carousel .nav.prev::before { content: "‹"; }
  body.carousel .nav.next::before { content: "›"; }
  @media (hover: hover) { body.carousel .nav:hover { background: rgba(20, 18, 16, .8); } }
  body.carousel .nav:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { body.carousel .cards { scroll-behavior: auto; } }
  @media (max-width: 639px) {
    /* phone: one card in focus, the next one peeking */
    body.carousel .cards { grid-auto-columns: 72vw; gap: 0 3vw; }
    body.carousel .card { border-radius: 4vw; }
    body.carousel .meta { height: 19vw; padding: 2.6vw 3.2vw 0; }
    body.carousel .name { font-size: 3.5vw; gap: 1.8vw; }
    body.carousel .name i { width: 1.7vw; height: 1.7vw; }
    body.carousel .line { font-size: 3.5vw; margin-top: 1.1vw; }
    body.carousel .nav { top: calc(72vw * 1.25 / 2 - 17px); }
  }
</style>
</head>
<body>
<main class="cards" id="cards" aria-live="off"></main>
<script>
(() => {
  const NS = "astrobox.profile-iframe";
  const group = new URLSearchParams(location.search).get("group") || "free";
  const send = (type, extra) => { try { parent.postMessage(Object.assign({ namespace: NS, version: 1, type }, extra), "*"); } catch (_) {} };

  // ---- height sync (AstroBox profile iframe protocol v1)
  let pending = false;
  const report = () => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      const b = document.body;
      send("resize", { height: Math.ceil(Math.max(b.getBoundingClientRect().height, b.offsetHeight, b.scrollHeight)) });
    });
  };
  const waiting = {};
  addEventListener("message", (e) => {
    const m = e.data;
    if (!m || m.namespace !== NS) return;
    if (m.type === "config" && m.requestResize) report();
    if (m.type === "open-resource-result" && m.requestId in waiting) {
      if (m.accepted) clearTimeout(waiting[m.requestId]);
      delete waiting[m.requestId];
    }
  });
  new ResizeObserver(report).observe(document.body);
  addEventListener("load", report);
  send("ready", {});

  const openResource = (id) => {
    const href = `https://astrobox.online/open?source=resv2&id=${id}&provider=OfficialV2&restype=watchface`;
    const requestId = `r${Date.now()}${Math.random().toString(36).slice(2, 6)}`;
    waiting[requestId] = setTimeout(() => { location.href = href; }, 500);  // older Apps
    send("open-resource", { requestId, href });
  };

  // ---- playback: lazy load, play only what is on screen, at most MAX at once
  const MAX = 5;  // per board; only cards at least 35% on screen play
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const visible = new Map();  // video -> visible ratio
  const schedule = () => {
    const run = !document.hidden && !still.matches;
    const ranked = [...visible.entries()].filter(([, r]) => r >= 0.35).sort((a, b) => b[1] - a[1]).map(([v]) => v);
    const allow = new Set(run ? ranked.slice(0, MAX) : []);
    document.querySelectorAll(".tile video").forEach((v) => {
      if (allow.has(v)) {
        if (!v.src) { v.src = v.dataset.src; }
        v.play().then(() => v.classList.add("on")).catch(() => {});
      } else if (!v.paused) {
        v.pause();
      }
    });
  };
  const io = new IntersectionObserver((es) => {
    es.forEach((e) => visible.set(e.target, e.isIntersecting ? e.intersectionRatio : 0));
    schedule();
  }, { threshold: [0, 0.35, 0.6, 1] });
  document.addEventListener("visibilitychange", schedule);
  still.addEventListener?.("change", schedule);

  // ---- group=new only: a slow, smooth carousel. Pauses while the pointer is
  // over it, for a while after any touch / wheel / key / button use, while
  // focus is inside, when it is off screen or the page is hidden, and never
  // runs with reduced motion. Manual buttons always work.
  function carousel(track) {
    document.body.classList.add("carousel");
    const wrap = document.createElement("div");
    wrap.className = "rail";
    track.replaceWith(wrap);
    wrap.appendChild(track);
    const mk = (dir, label) => {
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = `nav ${dir}`; btn.setAttribute("aria-label", label);
      wrap.appendChild(btn);
      return btn;
    };
    const prevBtn = mk("prev", "上一款"), nextBtn = mk("next", "下一款");
    const step = () => {
      const c = track.children;
      return c.length > 1 ? c[1].offsetLeft - c[0].offsetLeft : track.clientWidth;
    };
    const atEnd = () => track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
    const atStart = () => track.scrollLeft <= 4;
    // reduced motion: jump instead of gliding, for autoplay and the buttons alike
    const go = (dir) => {
      const behavior = still.matches ? "auto" : "smooth";
      if (dir > 0 && atEnd()) track.scrollTo({ left: 0, behavior });
      else if (dir < 0 && atStart()) track.scrollTo({ left: track.scrollWidth, behavior });
      else track.scrollBy({ left: dir * step(), behavior });
    };
    let hover = false, focusIn = false, onScreen = true, holdUntil = 0;
    const hold = () => { holdUntil = Date.now() + 7000; };
    prevBtn.addEventListener("click", () => { hold(); go(-1); });
    nextBtn.addEventListener("click", () => { hold(); go(1); });
    wrap.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") hover = true; });
    wrap.addEventListener("pointerleave", () => { hover = false; });
    ["pointerdown", "wheel", "touchstart", "keydown"].forEach((ev) => wrap.addEventListener(ev, hold, { passive: true }));
    wrap.addEventListener("focusin", () => { focusIn = true; });
    wrap.addEventListener("focusout", () => { focusIn = false; hold(); });
    new IntersectionObserver((es) => { onScreen = es.some((e) => e.isIntersecting && e.intersectionRatio > 0.3); },
      { threshold: [0, 0.3, 0.6] }).observe(wrap);
    // read-only snapshot of the pause conditions (for checks)
    setInterval(() => {
      if (still.matches || document.hidden || !onScreen || hover || focusIn || Date.now() < holdUntil) return;
      go(1);
    }, 4500);
  }

  fetch("cards.json?v=4").then((r) => r.json()).then((d) => {
    const g = d.groups[group];
    const root = document.getElementById("cards");
    root.setAttribute("aria-label", g.title);
    g.items.forEach((it) => {
      // only the title opens the face; the film and the description do not
      const b = document.createElement("article");
      b.className = "card";
      if (it.stage) b.style.setProperty("--stage", it.stage);
      // a still card (it.still) is just its image: no <video>, so no video request
      const media = it.still
        ? `<img src="../media/pop-${it.id}.jpg?v=1" alt="${it.name}" loading="lazy">`
        : `<img src="../media/pop-${it.id}.jpg?v=1" alt="" aria-hidden="true" loading="lazy">
          <video data-src="../media/pop-${it.id}.mp4?v=1" muted loop playsinline preload="none" disablepictureinpicture aria-hidden="true"></video>`;
      b.innerHTML = `
        <div class="tile">
          ${media}
        </div>
        <div class="meta"><button class="name" type="button"><i></i><span></span></button>
        <p class="line"></p></div>`;
      b.querySelector(".name span").textContent = it.name;
      b.querySelector(".line").textContent = it.line;
      const t = b.querySelector(".name");
      t.setAttribute("aria-label", `在 AstroBox 打开 ${it.name}`);
      t.addEventListener("click", () => openResource(it.id));
      root.appendChild(b);
      const v = b.querySelector("video");
      if (v) { visible.set(v, 0); io.observe(v); }
    });
    if (group === "new") carousel(root);
    report();
  }).catch(() => {});
})();
</script>
</body>
</html>
